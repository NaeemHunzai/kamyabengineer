<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Electricity Bill Calculator</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(120deg, #0078d7, #00b894);
    color: #fff;
    margin: 0;
    padding: 0;
  }
  .container {
    max-width: 850px;
    margin: 40px auto;
    background: rgba(255,255,255,0.1);
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.3);
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #fff;
  }
  label {
    display: block;
    margin: 8px 0 4px;
  }
  input[type="number"] {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    outline: none;
  }
  .section {
    background: rgba(255,255,255,0.15);
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 20px;
  }
  button {
    background: #00cec9;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover {
    background: #0984e3;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    padding: 8px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }
  th {
    background: rgba(0,0,0,0.2);
  }
  .result {
    text-align: center;
    background: rgba(0,0,0,0.2);
    padding: 20px;
    border-radius: 12px;
    font-size: 1.2em;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>⚡ Universal Electricity Bill Calculator ⚡</h1>

    <!-- Simple Usage -->
    <div class="section">
      <h2>Step 1: Basic Information</h2>
      <label>Electricity Rate ($ or your currency per kWh):</label>
      <input id="rate" type="number" step="0.0001" placeholder="e.g. 0.12">
      
      <label>Fixed Monthly Charge:</label>
      <input id="fixed" type="number" step="0.01" placeholder="e.g. 10">
      
      <label>Total Units Consumed (kWh):</label>
      <input id="units" type="number" step="0.01" placeholder="e.g. 250">
      
      <button onclick="calculateSimple()">Calculate Bill</button>
      
      <p class="result" id="simpleResult">Total Bill: —</p>
    </div>

    <!-- Appliance Section -->
    <div class="section">
      <h2>Step 2: Appliance-wise Consumption (Optional)</h2>
      <table id="applianceTable">
        <thead>
          <tr>
            <th>Appliance</th>
            <th>Wattage (W)</th>
            <th>Hours/Day</th>
            <th>Days</th>
            <th>Cost</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="applianceBody"></tbody>
      </table>
      <button onclick="addAppliance()">+ Add Appliance</button>
      <p class="result" id="applianceTotal">Total Appliance Cost: —</p>
    </div>

    <!-- Combined -->
    <div class="section">
      <h2>Step 3: Combined Result</h2>
      <div class="result" id="finalBill">Your Final Estimated Bill: —</div>
    </div>
  </div>

<script>
  // Calculate total from Step 1
  function calculateSimple() {
    const rate = parseFloat(document.getElementById('rate').value) || 0;
    const fixed = parseFloat(document.getElementById('fixed').value) || 0;
    const units = parseFloat(document.getElementById('units').value) || 0;
    const total = rate * units + fixed;
    document.getElementById('simpleResult').innerText = `Total Bill: ${format(total)}`;
    updateFinalBill();
  }

  // Add appliance row
  function addAppliance() {
    const tbody = document.getElementById('applianceBody');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><input type="text" placeholder="Name"></td>
      <td><input type="number" step="1" class="watt" value="100"></td>
      <td><input type="number" step="0.1" class="hour" value="1"></td>
      <td><input type="number" step="1" class="day" value="30"></td>
      <td class="cost">—</td>
      <td><button onclick="removeRow(this)">❌</button></td>
    `;
    tbody.appendChild(row);

    const inputs = row.querySelectorAll('input');
    inputs.forEach(i => i.addEventListener('input', calculateAppliances));
  }

  // Remove appliance
  function removeRow(btn) {
    btn.parentNode.parentNode.remove();
    calculateAppliances();
  }

  // Calculate appliance total
  function calculateAppliances() {
    const rate = parseFloat(document.getElementById('rate').value) || 0;
    let total = 0;
    document.querySelectorAll('#applianceBody tr').forEach(row => {
      const watt = parseFloat(row.querySelector('.watt').value) || 0;
      const hour = parseFloat(row.querySelector('.hour').value) || 0;
      const day = parseFloat(row.querySelector('.day').value) || 0;
      const kwh = (watt * hour * day) / 1000;
      const cost = kwh * rate;
      row.querySelector('.cost').innerText = format(cost);
      total += cost;
    });
    document.getElementById('applianceTotal').innerText = `Total Appliance Cost: ${format(total)}`;
    updateFinalBill();
  }

  // Combine results
  function updateFinalBill() {
    const rate = parseFloat(document.getElementById('rate').value) || 0;
    const fixed = parseFloat(document.getElementById('fixed').value) || 0;
    const units = parseFloat(document.getElementById('units').value) || 0;
    const simple = rate * units + fixed;

    let applianceTotal = 0;
    document.querySelectorAll('#applianceBody tr').forEach(row => {
      const text = row.querySelector('.cost').innerText.replace(/[^0-9.]/g, '');
      applianceTotal += parseFloat(text) || 0;
    });

    const final = Math.max(simple, fixed + applianceTotal);
    document.getElementById('finalBill').innerText = `Your Final Estimated Bill: ${format(final)}`;
  }

  // Utility format
  function format(num) {
    return isNaN(num) ? "—" : `$${num.toFixed(2)}`;
  }
</script>
</body>
</html>
